apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    opendatahub.io/connections: qwen35-9b-fp8
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: qwen35-9b-fp8
    serving.kserve.io/stop: "false"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  name: qwen35-9b-fp8
spec:
  model:
    name: qwen35-9b-fp8
    uri: pvc://qwen35-9b-fp9
  replicas: 1
  router:
    gateway:
      refs:
      - name: maas-default-gateway
        namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
    - env:
      - name: VLLM_ADDITIONAL_ARGS
        value: '--reasoning-parser=qwen3 --max-model-len=262144 --speculative-config=''{"method":"mtp", "num_speculative_tokens": 2}'''
      name: main
      resources:
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "4"
          memory: 4Gi
          nvidia.com/gpu: "1"
