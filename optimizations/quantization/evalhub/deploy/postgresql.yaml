---
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-db-credentials
  namespace: redhat-ods-applications
  labels:
    app: evalhub-postgres
  annotations:
    avp.kubernetes.io/path: "../cloud-rhai-tmm/evalhub-db-credentials.enc"
type: Opaque
stringData:
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: evalhub
  db-url: "postgres://user:password@evalhub-postgres.redhat-ods-applications.svc.cluster.local:5432/evalhub"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalhub-postgres
  namespace: redhat-ods-applications
  labels:
    app: evalhub-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evalhub-postgres
  template:
    metadata:
      labels:
        app: evalhub-postgres
    spec:
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-16:latest
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: evalhub-db-credentials
              key: POSTGRES_USER
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: evalhub-db-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: evalhub-db-credentials
              key: POSTGRES_DB
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["/usr/libexec/check-container"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: evalhub-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evalhub-postgres-data
  namespace: redhat-ods-applications
  labels:
    app: evalhub-postgres
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: evalhub-postgres
  namespace: redhat-ods-applications
  labels:
    app: evalhub-postgres
spec:
  selector:
    app: evalhub-postgres
  ports:
  - port: 5432
    targetPort: 5432
